<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <link rel="stylesheet" href="loginsignup.css">
</head>
<body>
    <div id="logindiv">
            <p>Enter mobile number</p>
            <input type="tel" placeholder="mobile" id="numberinput" required>
            <p>Enter password</p>
            <input type="password" placeholder="Password" id="passwordinput" required>
            <p id="errorshow"></p>
            <button id="loginbtn" type="submit" onclick="validateuser()">Login</button>
            <p id="registeropen" onclick="loadregisterdiv()">Don't have an account? Register</p>
    </div>
    <div id="registerdiv">
            <p>Enter mobile number</p>
            <input type="tel" placeholder="mobile" id="numberinputregister" required>
            <p>Enter password</p>
            <input type="password" placeholder="Password" id="passwordinputregister" required>
            <p id="errorshowregister"></p>
            <button id="signupbtn" type="submit" onclick="adduser()">Sign up</button>
            <p id="loginopen" onclick="loadlogindiv()">Already have an account? Login</p>
    </div>
    <script src="loginsignup.js"></script>
</body>
</html>
